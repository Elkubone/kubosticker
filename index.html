<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sticker Maker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e0533d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f1ec;--fg:#1d1b19;--card:#fff;--acc:#e0533d;--mut:#8a847c;--chk1:#e6e2db;--chk2:#f8f6f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171615;--fg:#f1ede7;--card:#262422;--acc:#ff7a63;--mut:#a09a92;--chk1:#33302d;--chk2:#3d3935}}
:root[data-theme="dark"]{--bg:#171615;--fg:#f1ede7;--card:#262422;--acc:#ff7a63;--mut:#a09a92;--chk1:#33302d;--chk2:#3d3935}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{font-size:1.25rem;margin:4px 0 0}
p.hint{margin:0;color:var(--mut);font-size:.9rem;line-height:1.4}
.card{background:var(--card);border-radius:14px;padding:10px}
canvas{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:8px}
#cv{touch-action:none;background:var(--chk1)}
#out{background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 50%/20px 20px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,label.btn{flex:1;min-width:120px;border:0;border-radius:12px;padding:14px 10px;font-size:1rem;font-weight:600;background:var(--card);color:var(--fg);text-align:center;cursor:pointer;box-shadow:0 0 0 1px var(--chk1) inset}
button.pri,label.pri{background:var(--acc);color:#fff;box-shadow:none}
button:disabled{opacity:.4}
.hidden{display:none!important}
input[type=range]{width:100%;accent-color:var(--acc)}
.sl{display:flex;align-items:center;gap:10px;font-size:.9rem;padding:4px 2px}
</style>
</head>
<body>
<main>
<h1>Sticker Maker</h1>

<section id="selView" class="hidden" style="display:flex;flex-direction:column;gap:12px">
</section>

<section id="start" class="card">
<p class="hint" style="margin-bottom:10px">Scatta o scegli una foto, poi disegna col dito un contorno attorno al soggetto da ritagliare.</p>
<div class="row">
<label class="btn pri">Scegli foto<input id="file" type="file" accept="image/*" hidden></label>
</div>
</section>

<section id="selWrap" class="hidden">
<div class="card"><canvas id="cv" width="10" height="10"></canvas></div>
<p class="hint" style="margin:10px 2px">Traccia una linea chiusa attorno al soggetto, anche approssimativa ma il più precisa possibile sui bordi.</p>
<div class="row">
<button id="reset" disabled>Rifai</button>
<button id="newPhoto">Altra foto</button>
<button id="cut" class="pri" disabled>Ritaglia</button>
</div>
</section>

<section id="resWrap" class="hidden">
<div class="card"><canvas id="out" width="512" height="512"></canvas></div>
<div class="card sl"><span>Bordo</span><input id="th" type="range" min="0" max="8" step="0.5" value="3"></div>
<div class="row">
<button id="share" class="pri">Condividi</button>
<button id="png">Salva PNG</button>
<button id="webp">Salva WebP</button>
</div>
<div class="row" style="margin-top:8px"><button id="back">Indietro</button></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),out=$('out'),octx=out.getContext('2d');
let base=null,pts=[],drawing=false,closed=false,cutC=null;

function show(which){
  $('start').classList.toggle('hidden',which!=='start');
  $('selWrap').classList.toggle('hidden',which!=='sel');
  $('resWrap').classList.toggle('hidden',which!=='res');
}
show('start');

$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();
  im.onload=()=>{
    const m=1600,s=Math.min(1,m/Math.max(im.width,im.height));
    base=document.createElement('canvas');
    base.width=Math.round(im.width*s);base.height=Math.round(im.height*s);
    base.getContext('2d').drawImage(im,0,0,base.width,base.height);
    cv.width=base.width;cv.height=base.height;
    pts=[];closed=false;redraw();upd();show('sel');
    URL.revokeObjectURL(im.src);
  };
  im.src=URL.createObjectURL(f);
  e.target.value='';
});

function pos(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};
}
function redraw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(base,0,0);
  if(pts.length<2)return;
  const path=()=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));if(closed)ctx.closePath();};
  if(closed){
    ctx.save();ctx.beginPath();ctx.rect(0,0,cv.width,cv.height);
    pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fill('evenodd');ctx.restore();
  }
  const lw=Math.max(2,cv.width/300);
  ctx.lineJoin=ctx.lineCap='round';
  path();ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=lw*2;ctx.stroke();
  path();ctx.strokeStyle='#fff';ctx.lineWidth=lw;ctx.stroke();
}
function upd(){$('cut').disabled=!closed;$('reset').disabled=!pts.length;}

cv.addEventListener('pointerdown',e=>{
  if(!base)return;
  cv.setPointerCapture(e.pointerId);
  pts=[pos(e)];closed=false;drawing=true;redraw();upd();
});
cv.addEventListener('pointermove',e=>{
  if(!drawing)return;
  const p=pos(e),l=pts[pts.length-1];
  if(Math.hypot(p.x-l.x,p.y-l.y)>2){pts.push(p);redraw();}
});
const end=()=>{
  if(!drawing)return;drawing=false;
  if(pts.length>8)closed=true;else pts=[];
  redraw();upd();
};
cv.addEventListener('pointerup',end);
cv.addEventListener('pointercancel',end);

$('reset').onclick=()=>{pts=[];closed=false;redraw();upd();};
$('newPhoto').onclick=()=>$('file').click();
$('back').onclick=()=>show('sel');

$('cut').onclick=()=>{
  let x0=1e9,y0=1e9,x1=-1,y1=-1;
  pts.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});
  x0=Math.max(0,Math.floor(x0));y0=Math.max(0,Math.floor(y0));
  x1=Math.min(base.width,Math.ceil(x1));y1=Math.min(base.height,Math.ceil(y1));
  const bw=Math.max(1,x1-x0),bh=Math.max(1,y1-y0);
  cutC=document.createElement('canvas');cutC.width=bw;cutC.height=bh;
  const c=cutC.getContext('2d');
  c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p.x-x0,p.y-y0):c.moveTo(p.x-x0,p.y-y0));c.closePath();
  c.clip();c.drawImage(base,-x0,-y0);
  render();show('res');
};

function render(){
  const bw=cutC.width,bh=cutC.height;
  const r=Math.round(+$('th').value*Math.max(bw,bh)/100),pad=r+2;
  const W=bw+2*pad,H=bh+2*pad;
  const sil=document.createElement('canvas');sil.width=W;sil.height=H;
  const sc=sil.getContext('2d');
  sc.drawImage(cutC,pad,pad);
  sc.globalCompositeOperation='source-in';sc.fillStyle='#fff';sc.fillRect(0,0,W,H);
  const st=document.createElement('canvas');st.width=W;st.height=H;
  const s=st.getContext('2d');
  if(r>0)for(let k=0;k<32;k++){const a=k/32*Math.PI*2;s.drawImage(sil,Math.cos(a)*r,Math.sin(a)*r);}
  s.drawImage(cutC,pad,pad);
  octx.clearRect(0,0,512,512);
  const k=Math.min(500/W,500/H),w=W*k,h=H*k;
  octx.imageSmoothingQuality='high';
  octx.drawImage(st,(512-w)/2,(512-h)/2,w,h);
}
$('th').addEventListener('input',()=>cutC&&render());

function blobOf(type){return new Promise(r=>out.toBlob(r,type,0.92));}
function save(b,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$('png').onclick=async()=>save(await blobOf('image/png'),'sticker.png');
$('webp').onclick=async()=>save(await blobOf('image/webp'),'sticker.webp');
$('share').onclick=async()=>{
  const b=await blobOf('image/png'),f=new File([b],'sticker.png',{type:'image/png'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
    else save(b,'sticker.png');
  }catch(e){}
};
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
